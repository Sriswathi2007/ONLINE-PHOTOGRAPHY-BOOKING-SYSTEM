<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Login | PhotoStudio</title>
</head>
<body>
    <nav>
        <h2>📸 PhotoStudio</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="auth-box">
            <h2>USER LOGIN</h2>
            <form id="loginForm">
                <input type="email" id="lEmail" placeholder="Email Address" required>
                <input type="password" id="lPass" placeholder="Password" required>
                <button type="submit" class="btn-primary">SECURE LOGIN</button>
            </form>
            <p style="margin-top: 15px;">New? <a href="signup.html" style="color:#ff4757">Create Account</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('lEmail').value;
            const password = document.getElementById('lPass').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    // --- CRITICAL SESSION LOCK ---
                    // This satisfies the condition for the Photographers page
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email); 
                    
                    alert("Login Successful!");
                    
                    // Redirect to the photographers page to start booking
                    window.location.href = 'photographers.html';
                } else {
                    alert("Invalid Email or Password. Please try again.");
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Server error. Make sure your Node.js server is running.");
            }
        });
    </script>
</body>
</html>
